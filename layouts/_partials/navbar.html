<header class="relative bg-gradient-to-r from-blue-900 to-teal-700 text-white">
    <div class="container mx-auto px-4 md:px-6">
        <div class="flex items-center justify-between h-20">
            <!-- 左侧 Logo -->
            <div class="flex items-center">
                <div class="flex-shrink-0 flex items-center">
                    <svg class="h-8 w-8 text-white mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <div>
                        <div class="text-xs font-semibold tracking-wider uppercase">Southland and</div>
                        <div class="text-sm font-bold">Interventional Radiology</div>
                    </div>
                </div>
            </div>

            <!-- 中间导航链接 - 桌面版 -->
            <nav class="hidden md:flex space-x-8">
                <a href="#" class="text-white hover:text-blue-200 font-medium transition-colors duration-200">Home</a>
                <a href="#" class="text-white hover:text-blue-200 font-medium transition-colors duration-200">About us</a>
                <a href="#" class="text-white hover:text-blue-200 font-medium transition-colors duration-200">Service</a>
                <a href="#" class="text-white hover:text-blue-200 font-medium transition-colors duration-200">Blogs</a>
            </nav>

            <!-- 右侧登录/注册按钮 -->
            <div class="hidden md:flex items-center space-x-4">
                <a href="#" class="px-4 py-2 border border-white text-white rounded-md hover:bg-white hover:bg-opacity-10 transition-colors duration-200 text-sm font-medium">
                    Login
                </a>
                <a href="#" class="px-4 py-2 bg-blue-800 text-white rounded-md hover:bg-blue-700 transition-colors duration-200 text-sm font-medium">
                    Sign up
                </a>
            </div>

            <!-- 移动端菜单按钮 -->
            <div class="md:hidden">
                <button type="button" class="text-white hover:text-blue-200 focus:outline-none" aria-label="Toggle menu">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 移动端菜单 - 默认隐藏 -->
    <div class="md:hidden hidden bg-blue-800 bg-opacity-95">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-blue-700 hover:text-white">Home</a>
            <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-blue-700 hover:text-white">About us</a>
            <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-blue-700 hover:text-white">Service</a>
            <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-blue-700 hover:text-white">Blogs</a>
        </div>
        <div class="pt-4 pb-3 border-t border-blue-700">
            <div class="flex items-center px-5">
                <div class="flex flex-col space-y-3 pb-4">
                    <a href="#" class="px-4 py-2 border border-white text-white rounded-md text-center hover:bg-white hover:bg-opacity-10 transition-colors duration-200 text-sm font-medium">
                        Login
                    </a>
                    <a href="#" class="px-4 py-2 bg-blue-800 text-white rounded-md text-center hover:bg-blue-700 transition-colors duration-200 text-sm font-medium">
                        Sign up
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>
